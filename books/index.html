<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Library statistics</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #191919;

            font-family:
                "Manrope",
                sans-serif;
        }


        .widget {
            position: relative;

            width: 100%;
            height: 300px;

            overflow: hidden;

            border-radius: 16px;

            background-image:
                url("./images/library-pages.png");

            background-size: cover;

            background-position:
                center center;

            color: #fffaf2;

            box-shadow:
                0 8px 24px
                rgba(0, 0, 0, 0.18);
        }


        /*
        Затемняем в первую очередь
        левую часть под текст.
        Справа картинка остается
        практически нетронутой.
        */

        .widget::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,

                    rgba(20, 13, 8, 0.78)
                        0%,

                    rgba(20, 13, 8, 0.62)
                        24%,

                    rgba(20, 13, 8, 0.30)
                        46%,

                    rgba(20, 13, 8, 0.08)
                        70%,

                    rgba(20, 13, 8, 0.02)
                        100%
                );

            z-index: 1;
        }


        /*
        Немного затемнения снизу,
        чтобы картинка выглядела
        цельнее в Notion.
        */

        .widget::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,

                    rgba(14, 10, 8, 0.32)
                        0%,

                    transparent
                        46%
                );

            z-index: 1;

            pointer-events: none;
        }


        .content {
            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            z-index: 2;

            width: min(
                48%,
                570px
            );

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding:
                28px 34px;
        }


        .number {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    72px,
                    8vw,
                    112px
                );

            line-height: 0.82;

            font-weight: 700;

            letter-spacing:
                -0.045em;

            color: #fff8ea;

            text-shadow:
                0 3px 12px
                    rgba(0, 0, 0, 0.65),

                0 8px 30px
                    rgba(0, 0, 0, 0.32);
        }


        .meta {
            margin-top: 20px;

            font-size:
                clamp(
                    11px,
                    1.1vw,
                    14px
                );

            font-weight: 600;

            letter-spacing:
                0.04em;

            text-transform:
                lowercase;

            color:
                rgba(
                    255,
                    239,
                    217,
                    0.80
                );

            text-shadow:
                0 2px 8px
                    rgba(0, 0, 0, 0.68);
        }


        .divider {
            width: 58px;
            height: 1px;

            margin:
                18px 0 15px;

            background:
                linear-gradient(
                    90deg,

                    rgba(
                        240,
                        199,
                        137,
                        0.95
                    ),

                    transparent
                );
        }


        .phrase {
            max-width: 420px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    19px,
                    1.8vw,
                    25px
                );

            line-height: 1.12;

            font-style: italic;

            font-weight: 500;

            color:
                rgba(
                    255,
                    244,
                    228,
                    0.94
                );

            text-shadow:
                0 2px 9px
                    rgba(0, 0, 0, 0.72),

                0 6px 20px
                    rgba(0, 0, 0, 0.34);
        }


        /*
        Пока идет первый запрос,
        цифра не дергается.
        */

        .number.loading {
            opacity: 0.65;
        }


        @media (
            max-width: 700px
        ) {

            .widget {
                height: 280px;

                background-position:
                    58% center;
            }


            .widget::before {

                background:
                    linear-gradient(
                        90deg,

                        rgba(
                            20,
                            13,
                            8,
                            0.82
                        )
                            0%,

                        rgba(
                            20,
                            13,
                            8,
                            0.58
                        )
                            48%,

                        rgba(
                            20,
                            13,
                            8,
                            0.10
                        )
                            100%
                    );

            }


            .content {
                width: 70%;

                padding:
                    24px 22px;
            }

        }

    </style>
</head>


<body>

    <div class="widget">

        <div class="content">

            <div
                class="number loading"
                id="pages-number"
            >
                —
            </div>


            <div
                class="meta"
                id="pages-meta"
            >
                страниц прочитано · 2026
            </div>


            <div class="divider"></div>


            <div class="phrase">
                Все это началось с одной страницы.
            </div>

        </div>

    </div>


<script>

    const numberElement =
        document.getElementById(
            "pages-number"
        );


    const STORAGE_KEY =
        "jemm-library-pages-2026";


    function formatPages(value) {

        return new Intl.NumberFormat(
            "ru-RU"
        ).format(value);

    }


    /*
    Если Notion / Netlify однажды
    ответят медленно, сначала показываем
    последнее удачное значение.
    */

    function loadCachedValue() {

        const cached =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!cached) {
            return;
        }


        const number =
            Number(cached);


        if (
            !Number.isNaN(number)
        ) {

            numberElement.textContent =
                formatPages(number);


            numberElement.classList.remove(
                "loading"
            );

        }

    }


    async function loadLibraryStats() {

        try {

            const response =
                await fetch(
                    "/.netlify/functions/library-stats"
                );


            if (!response.ok) {

                throw new Error(
                    `Stats request failed: ${response.status}`
                );

            }


            const stats =
                await response.json();


            if (
                typeof stats.pages !==
                "number"
            ) {

                throw new Error(
                    "Invalid pages value"
                );

            }


            numberElement.textContent =
                formatPages(
                    stats.pages
                );


            numberElement.classList.remove(
                "loading"
            );


            localStorage.setItem(
                STORAGE_KEY,
                String(
                    stats.pages
                )
            );


            console.log(
                "Library stats updated:",
                stats
            );

        }

        catch (error) {

            console.error(
                "Не удалось обновить книжный счетчик:",
                error
            );

        }

    }


    /*
    Сначала мгновенно показываем
    кеш, если он есть.
    */

    loadCachedValue();


    /*
    Затем запрашиваем актуальное
    значение из Notion.
    */

    loadLibraryStats();


    /*
    И обновляемся каждые 5 минут
    без перезагрузки страницы Notion.
    */

    setInterval(
        loadLibraryStats,
        5 * 60 * 1000
    );

</script>

</body>
</html>
