<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Library Pages</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #191919;
        }

        body {
            font-family:
                "Manrope",
                sans-serif;
        }


        /* =========================
           ВЕСЬ ВИДЖЕТ
           ========================= */

        .widget {
            position: relative;

            width: 100vw;
            height: 100vh;

            min-height: 260px;

            overflow: hidden;

            border-radius: 16px;

            background-image:
                url("./images/library-pages.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #fff8ef;
        }


        /* затемнение картинки */

        .widget::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(19, 12, 8, 0.67) 0%,
                    rgba(19, 12, 8, 0.46) 50%,
                    rgba(19, 12, 8, 0.28) 100%
                );

            z-index: 1;
        }


        /* =========================
           КОНТЕНТ
           ========================= */

        .content {
            position: relative;

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: flex-start;

            padding:
                30px
                34px;

            text-align: left;
        }


        /* =========================
           ЧИСЛО
           ========================= */

        .number {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    64px,
                    11vw,
                    96px
                );

            line-height: 0.88;

            font-weight: 600;

            letter-spacing: -0.04em;

            color: #fff7ea;

            text-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.55);
        }


        /* =========================
           ПОДПИСЬ
           ========================= */

        .meta {
            margin-top: 18px;

            font-family:
                "Manrope",
                sans-serif;

            font-size:
                clamp(
                    11px,
                    1.8vw,
                    14px
                );

            font-weight: 500;

            letter-spacing: 0.04em;

            color:
                rgba(
                    255,
                    237,
                    215,
                    0.78
                );

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.55);
        }


        /* =========================
           РАЗДЕЛИТЕЛЬ
           ========================= */

        .divider {
            width: 54px;
            height: 1px;

            margin:
                16px
                0
                14px;

            background:
                linear-gradient(
                    90deg,
                    rgba(232, 181, 115, 0.95),
                    transparent
                );
        }


        /* =========================
           ФРАЗА
           ========================= */

        .phrase {
            max-width: 420px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    21px,
                    3.4vw,
                    29px
                );

            line-height: 1.15;

            font-style: italic;

            font-weight: 500;

            color:
                rgba(
                    255,
                    247,
                    235,
                    0.94
                );

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.58);
        }


        /* =========================
           ОШИБКА
           ========================= */

        .error {
            font-family:
                "Manrope",
                sans-serif;

            font-size: 13px;

            color:
                rgba(
                    255,
                    235,
                    215,
                    0.75
                );
        }


        /* =========================
           УЗКИЙ ВИДЖЕТ
           ========================= */

        @media (max-width: 500px) {

            .content {
                padding:
                    25px
                    28px;
            }

            .phrase {
                max-width: 90%;
            }

        }

    </style>
</head>


<body>

<div class="widget">

    <div class="content">

        <div
            class="number"
            id="pages"
        >
            —
        </div>


        <div
            class="meta"
            id="meta"
        >
            страниц прочитано · 2026
        </div>


        <div class="divider"></div>


        <div
            class="phrase"
            id="phrase"
        >
            Все это началось с одной страницы.
        </div>

    </div>

</div>


<script>

    const DATA_URL =
        "../data/library.json";


    function formatNumber(value) {

        return new Intl.NumberFormat(
            "ru-RU"
        ).format(value);

    }


    async function loadStats() {

        try {

            const response =
                await fetch(
                    DATA_URL +
                    "?t=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            if (
                typeof data.pages !==
                "number"
            ) {

                throw new Error(
                    "Invalid pages value"
                );

            }


            document.getElementById(
                "pages"
            ).textContent =
                formatNumber(
                    data.pages
                );


            document.getElementById(
                "meta"
            ).textContent =
                `страниц прочитано · ${data.year ?? 2026}`;

        }

        catch (error) {

            console.error(
                "Library stats error:",
                error
            );


            document.getElementById(
                "pages"
            ).textContent =
                "—";


            document.getElementById(
                "meta"
            ).textContent =
                "не удалось обновить статистику";

        }

    }


    /* первый запуск */

    loadStats();


    /*
    Проверяем свежий JSON каждые 5 минут.
    Сам GitHub Action обновляет его
    каждые 15 минут.
    */

    setInterval(
        loadStats,
        5 * 60 * 1000
    );

</script>

</body>
</html>
