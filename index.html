<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Genshin Stats</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;

            background: #191919;
        }

        body {
            font-family:
                "Manrope",
                sans-serif;
        }


        /* =========================
           ОБЩАЯ СЕТКА
           ========================= */

        .stats {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 14px;
        }


        /* =========================
           КАРТОЧКА
           ========================= */

        .card {
            position: relative;

            min-height: 250px;

            overflow: hidden;

            border-radius: 16px;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #fff8ef;

            isolation: isolate;
        }


        .card::before {
            content: "";

            position: absolute;
            inset: 0;

            z-index: -1;

            background:
                linear-gradient(
                    180deg,
                    rgba(17, 11, 8, 0.17) 0%,
                    rgba(17, 11, 8, 0.48) 54%,
                    rgba(17, 11, 8, 0.76) 100%
                );
        }


        .card-content {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                25px
                25px
                24px;
        }


        /* =========================
           ЦИФРЫ
           ========================= */

        .number {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    52px,
                    7vw,
                    74px
                );

            line-height: 0.9;

            font-weight: 600;

            letter-spacing: -0.035em;

            color: #fff7ea;

            text-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.55);
        }


        .number.compound {
            display: flex;

            align-items: baseline;

            gap: 6px;

            white-space: nowrap;
        }


        .number .slash {
            font-size: 0.56em;

            font-weight: 500;

            opacity: 0.55;
        }


        .number .total {
            font-size: 0.56em;

            font-weight: 500;

            opacity: 0.72;
        }


        /* =========================
           ПОДПИСЬ
           ========================= */

        .meta {
            margin-top: 11px;

            font-size:
                clamp(
                    10px,
                    1.5vw,
                    13px
                );

            font-weight: 500;

            letter-spacing: 0.055em;

            color:
                rgba(
                    255,
                    239,
                    219,
                    0.72
                );

            text-shadow:
                0 2px 7px
                rgba(0, 0, 0, 0.55);
        }


        .divider {
            width: 46px;
            height: 1px;

            margin:
                14px
                0
                12px;

            background:
                linear-gradient(
                    90deg,
                    rgba(229, 181, 119, 0.90),
                    transparent
                );
        }


        /* =========================
           ФРАЗА
           ========================= */

        .phrase {
            max-width: 310px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    17px,
                    2.2vw,
                    23px
                );

            line-height: 1.12;

            font-style: italic;

            font-weight: 500;

            color:
                rgba(
                    255,
                    247,
                    235,
                    0.92
                );

            text-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.62);
        }


        /* =========================
           ФОНЫ
           ========================= */

        .days-card {
            background-image:
                url("./images/days.jpg");
        }

        .achievements-card {
            background-image:
                url("./images/achievements.jpg");
        }

        .characters-card {
            background-image:
                url("./images/characters.jpg");
        }


        /* =========================
           АДАПТИВ
           ========================= */

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: 220px;
            }

        }

    </style>
</head>


<body>

<div class="stats">

    <!-- ДНИ -->

    <div class="card days-card">

        <div class="card-content">

            <div
                class="number"
                id="days"
            >
                —
            </div>

            <div class="meta">
                дней в Тейвате
            </div>

            <div class="divider"></div>

            <div class="phrase">
                Когда-то это был просто пролог.
            </div>

        </div>

    </div>


    <!-- ДОСТИЖЕНИЯ -->

    <div class="card achievements-card">

        <div class="card-content">

            <div class="number compound">

                <span id="achievements-current">
                    —
                </span>

                <span class="slash">
                    /
                </span>

                <span
                    class="total"
                    id="achievements-total"
                >
                    —
                </span>

            </div>

            <div class="meta">
                достижений
            </div>

            <div class="divider"></div>

            <div class="phrase">
                Еще чуть-чуть до полного списка. Ну, относительно.
            </div>

        </div>

    </div>


    <!-- ПЕРСОНАЖИ -->

    <div class="card characters-card">

        <div class="card-content">

            <div class="number compound">

                <span id="characters-current">
                    —
                </span>

                <span class="slash">
                    /
                </span>

                <span
                    class="total"
                    id="characters-total"
                >
                    —
                </span>

            </div>

            <div class="meta">
                персонажей
            </div>

            <div class="divider"></div>

            <div class="phrase">
                Коллекция продолжает расти вопреки здравому смыслу.
            </div>

        </div>

    </div>

</div>


<script>

    const DATA_URL =
        "https://raw.githubusercontent.com/gogotun-sketch/jemm-genshin-widgets/main/data/genshin.json";


    /* =========================
       ДНИ В ТЕЙВАТЕ
       ========================= */

    function updateDays() {

        const now =
            new Date();


        const today =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            );


        const start =
            new Date(
                2020,
                8,
                29
            );


        const millisecondsPerDay =
            24 * 60 * 60 * 1000;


        const days =
            Math.floor(
                (
                    today.getTime() -
                    start.getTime()
                ) /
                millisecondsPerDay
            ) + 1;


        document.getElementById(
            "days"
        ).textContent =
            new Intl.NumberFormat(
                "ru-RU"
            ).format(days);

    }


    /* =========================
       ДАННЫЕ NOTION
       ========================= */

    async function loadStats() {

        try {

            const response =
                await fetch(
                    DATA_URL +
                    "?t=" +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            document.getElementById(
                "achievements-current"
            ).textContent =
                data.achievements?.current
                ?? "—";


            document.getElementById(
                "achievements-total"
            ).textContent =
                data.achievements?.total
                ?? "—";


            document.getElementById(
                "characters-current"
            ).textContent =
                data.characters?.current
                ?? "—";


            document.getElementById(
                "characters-total"
            ).textContent =
                data.characters?.total
                ?? "—";

        }

        catch (error) {

            console.error(
                "Genshin stats error:",
                error
            );

        }

    }


    updateDays();
    loadStats();


    /* проверяем дату раз в минуту */

    setInterval(
        updateDays,
        60 * 1000
    );


    /* данные обновляем раз в 5 минут */

    setInterval(
        loadStats,
        5 * 60 * 1000
    );

</script>

</body>
</html>
