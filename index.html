<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тейват в цифрах</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #191919;

            font-family: "Manrope", sans-serif;
        }


        .widgets {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 14px;

            background: #191919;
        }


        /* ----------------------------- */
        /* КАРТОЧКИ */
        /* ----------------------------- */

        .card {
            position: relative;

            min-width: 0;
            height: 250px;

            overflow: hidden;

            border-radius: 16px;

            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            color: #fffaf2;

            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.18);
        }


        /* затемнение картинки */

        .card::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(8, 10, 15, 0.78) 0%,
                    rgba(8, 10, 15, 0.46) 34%,
                    rgba(8, 10, 15, 0.16) 65%,
                    rgba(8, 10, 15, 0.02) 100%
                );

            z-index: 1;
        }


        /* легкое теплое свечение */

        .card::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 80%,
                    rgba(255, 224, 173, 0.10),
                    transparent 42%
                );

            z-index: 1;

            pointer-events: none;
        }


        /* ----------------------------- */
        /* КАРТИНКИ */
        /* ----------------------------- */

        .card-days {
            background-image: url("./images/days.jpg");
        }

        .card-achievements {
            background-image: url("./images/achievements.jpg");
        }

        .card-characters {
            background-image: url("./images/characters.jpg");
        }


        /* ----------------------------- */
        /* ТЕКСТ */
        /* ----------------------------- */

        .content {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 2;

            padding: 18px 19px 17px;
        }


        .number {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(56px, 6vw, 78px);

            line-height: 0.86;

            font-weight: 700;

            letter-spacing: -0.04em;

            color: #fffaf2;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.62),
                0 7px 24px rgba(0, 0, 0, 0.32);

            transition: opacity 0.25s ease;
        }


        .meta {
            margin-top: 6px;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.02em;

            color: rgba(255, 247, 235, 0.76);

            text-shadow:
                0 2px 7px rgba(0, 0, 0, 0.65);
        }


        .phrase {
            margin-top: 13px;

            font-family: "Cormorant Garamond", serif;

            font-size: clamp(17px, 1.5vw, 21px);

            line-height: 1.13;

            font-style: italic;
            font-weight: 500;

            color: rgba(255, 247, 235, 0.96);

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.72),
                0 5px 18px rgba(0, 0, 0, 0.38);
        }


        @media (max-width: 850px) {

            .widgets {
                grid-template-columns: 1fr;
            }

            .card {
                height: 280px;
            }

        }

    </style>
</head>


<body>

<div class="widgets">


    <!-- ДНИ В ТЕЙВАТЕ -->

    <article class="card card-days">

        <div class="content">

            <div
                class="number"
                id="days-number"
            >
                —
            </div>

            <div class="meta">
                дней в Тейвате
            </div>

            <div class="phrase">
                Когда-то это был просто пролог.
            </div>

        </div>

    </article>



    <!-- ДОСТИЖЕНИЯ -->

    <article class="card card-achievements">

        <div class="content">

            <div
                class="number"
                id="achievements-number"
            >
                —
            </div>

            <div
                class="meta"
                id="achievements-meta"
            >
                из —
            </div>

            <div class="phrase">
                Еще чуть-чуть до полного списка. Ну, относительно.
            </div>

        </div>

    </article>



    <!-- ПЕРСОНАЖИ -->

    <article class="card card-characters">

        <div class="content">

            <div
                class="number"
                id="characters-number"
            >
                —
            </div>

            <div
                class="meta"
                id="characters-meta"
            >
                из —
            </div>

            <div class="phrase">
                Коллекция продолжает расти вопреки здравому смыслу.
            </div>

        </div>

    </article>


</div>



<script>

    /* -------------------------------- */
    /* ДНИ В ТЕЙВАТЕ */
    /* -------------------------------- */

    function calculateTeyvatDays() {

        /*
        Считаем через UTC, чтобы переходы
        на летнее/зимнее время нигде
        не могли испортить счетчик.
        */

        const start =
            Date.UTC(
                2020,
                8,
                29
            );


        const now =
            new Date();


        const today =
            Date.UTC(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            );


        const difference =
            today - start;


        /*
        +1:
        29 сентября 2020 считается
        первым днем в Тейвате.
        */

        return (
            Math.floor(
                difference / 86400000
            ) + 1
        );

    }


    function updateDays() {

        document.getElementById(
            "days-number"
        ).textContent =
            calculateTeyvatDays();

    }



    /* -------------------------------- */
    /* ДАННЫЕ ИЗ NOTION */
    /* -------------------------------- */

    async function loadGenshinStats() {

        try {

            const response =
                await fetch(
                    "/.netlify/functions/genshin-stats"
                );


            if (!response.ok) {

                throw new Error(
                    `Ошибка загрузки статистики: ${response.status}`
                );

            }


            const stats =
                await response.json();


            /* ДОСТИЖЕНИЯ */

            document.getElementById(
                "achievements-number"
            ).textContent =
                stats.achievements.current;


            document.getElementById(
                "achievements-meta"
            ).textContent =
                "из " +
                stats.achievements.total;



            /* ПЕРСОНАЖИ */

            document.getElementById(
                "characters-number"
            ).textContent =
                stats.characters.current;


            document.getElementById(
                "characters-meta"
            ).textContent =
                "из " +
                stats.characters.total;


            console.log(
                "Genshin stats updated:",
                stats.updatedAt
            );

        }

        catch (error) {

            console.error(
                "Не удалось обновить статистику:",
                error
            );

        }

    }



    /* -------------------------------- */
    /* ПЕРВЫЙ ЗАПУСК */
    /* -------------------------------- */

    updateDays();

    loadGenshinStats();



    /* -------------------------------- */
    /* АВТООБНОВЛЕНИЕ */
    /* -------------------------------- */


    /*
    Проверяем статистику Notion
    каждые пять минут.
    */

    setInterval(
        loadGenshinStats,
        5 * 60 * 1000
    );


    /*
    На случай, если страница Notion
    остается открытой через полночь:
    пересчитываем дни раз в минуту.
    */

    setInterval(
        updateDays,
        60 * 1000
    );

</script>

</body>
</html>
