<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Watching Stats</title>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
    rel="stylesheet"
>


<style>


* {
    box-sizing:
        border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        #191919;

}


body {

    font-family:
        "Manrope",
        sans-serif;

}


/* =========================
   ВИДЖЕТ
   ========================= */

.widget {

    position: relative;

    width: 100vw;
    height: 100vh;

    min-height: 260px;

    overflow: hidden;

    color:
        #fff7eb;

}


/* =========================
   ФОН
   ========================= */

.background {

    position: absolute;

    inset: 0;

    background-image:
        url("./images/watching.png");

    background-size:
        cover;

    background-position:
        center;

    background-repeat:
        no-repeat;

    z-index: 0;

}


/* =========================
   ЗАТЕМНЕНИЕ
   ========================= */

.overlay {

    position: absolute;

    inset: 0;

    z-index: 1;


    background:

        linear-gradient(

            90deg,

            rgba(25, 17, 12, .65) 0%,

            rgba(32, 21, 14, .48) 30%,

            rgba(35, 23, 15, .19) 58%,

            rgba(35, 23, 15, .04) 100%

        );

}


/* =========================
   КОНТЕНТ
   ========================= */

.content {

    position: relative;

    z-index: 2;


    width: 52%;
    height: 100%;


    display: flex;

    flex-direction: column;

    justify-content: center;


    padding-left:
        7%;

}


/* =========================
   ЧИСЛО
   ========================= */

.number {

    font-family:
        "Cormorant Garamond",
        serif;


    font-size:

        clamp(

            72px,

            12vw,

            116px

        );


    line-height:
        .82;


    font-weight:
        600;


    letter-spacing:
        -.045em;


    color:
        #fff7e9;


    text-shadow:

        0 4px 18px
        rgba(0, 0, 0, .55);

}


/* =========================
   ПОДПИСЬ
   ========================= */

.label {

    margin-top:
        16px;


    font-family:
        "Manrope",
        sans-serif;


    font-size:

        clamp(

            11px,

            1.6vw,

            14px

        );


    font-weight:
        500;


    letter-spacing:
        .055em;


    color:

        rgba(
            255,
            237,
            214,
            .82
        );


    text-shadow:

        0 2px 8px
        rgba(0, 0, 0, .5);

}


/* =========================
   РАЗДЕЛИТЕЛЬ
   ========================= */

.divider {

    width:
        55px;

    height:
        1px;


    margin:

        18px
        0
        15px;


    background:

        linear-gradient(

            90deg,

            rgba(223, 161, 103, .95),

            transparent

        );

}


/* =========================
   ФРАЗА
   ========================= */

.phrase {

    max-width:
        410px;


    font-family:
        "Cormorant Garamond",
        serif;


    font-size:

        clamp(

            22px,

            3.2vw,

            32px

        );


    line-height:
        1.14;


    font-style:
        italic;


    font-weight:
        500;


    color:

        rgba(
            255,
            246,
            233,
            .96
        );


    text-shadow:

        0 3px 12px
        rgba(0, 0, 0, .6);

}


/* =========================
   МОБИЛЬНАЯ / УЗКАЯ ВЕРСИЯ
   ========================= */

@media (max-width: 650px) {

    .content {

        width:
            100%;


        padding:

            26px
            28px;

    }


    .overlay {

        background:

            rgba(
                27,
                18,
                12,
                .48
            );

    }

}


</style>

</head>


<body>


<div class="widget">


    <div class="background"></div>


    <div class="overlay"></div>


    <div class="content">


        <div
            class="number"
            id="hours"
        >
            —
        </div>


        <div
            class="label"
            id="label"
        >
            часов просмотрено · 2026
        </div>


        <div class="divider"></div>


        <div class="phrase">

            Исследование сюжетов требует времени.

        </div>


    </div>


</div>


<script>


const DATA_URL =

    "https://raw.githubusercontent.com/gogotun-sketch/jemm-genshin-widgets/main/data/watching.json";



function formatHours(
    value
) {

    return new Intl.NumberFormat(

        "ru-RU",

        {

            minimumFractionDigits:
                0,

            maximumFractionDigits:
                2

        }

    ).format(value);

}



async function loadStats() {


    try {


        const response =

            await fetch(

                DATA_URL +

                "?t=" +

                Date.now(),

                {

                    cache:
                        "no-store"

                }

            );


        if (!response.ok) {

            throw new Error(

                `HTTP ${response.status}`

            );

        }


        const data =

            await response.json();


        const hours =

            Number(
                data.totalHours
            );


        if (
            !Number.isFinite(hours)
        ) {

            throw new Error(
                "Invalid totalHours value"
            );

        }


        document
            .getElementById("hours")
            .textContent =

                formatHours(
                    hours
                );


        document
            .getElementById("label")
            .textContent =

                `часов просмотрено · ${data.year ?? 2026}`;


    }


    catch(error) {


        console.error(

            "Watching stats error:",

            error

        );


        document
            .getElementById("hours")
            .textContent =
                "—";


    }

}



loadStats();


setInterval(

    loadStats,

    5 * 60 * 1000

);


</script>


</body>

</html>
