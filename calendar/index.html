<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calendar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #191919;

            font-family:
                "Manrope",
                sans-serif;
        }


        /* =========================
           ВЕСЬ ВИДЖЕТ
           ========================= */

        .calendar-widget {
            position: relative;

            width: 100%;
            height: 360px;

            overflow: hidden;

            border-radius: 16px;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #fff8ec;
        }


        /* легкое затемнение всего фона */

        .calendar-widget::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,

                    rgba(18, 11, 7, 0.30) 0%,
                    rgba(18, 11, 7, 0.18) 38%,
                    rgba(18, 11, 7, 0.04) 75%,
                    transparent 100%
                );

            z-index: 1;
        }


        /* =========================
           ПАНЕЛЬ КАЛЕНДАРЯ
           ========================= */

        .calendar-panel {
            position: relative;

            z-index: 2;

            width: 325px;

            margin: 16px;

            padding:
                19px
                21px
                18px;

            border-radius: 18px;

            background:
                rgba(20, 12, 8, 0.57);

            border:
                1px solid
                rgba(255, 236, 214, 0.10);

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);

            box-shadow:
                0 12px 34px
                rgba(0, 0, 0, 0.22);
        }


        /* =========================
           ЗАГОЛОВОК
           ========================= */

        .month-title {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 34px;

            line-height: 0.95;

            font-weight: 600;

            text-transform: lowercase;

            letter-spacing: -0.025em;

            color: #fff5e6;

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.45);
        }


        .year {
            margin-top: 5px;

            font-size: 10px;

            font-weight: 500;

            letter-spacing: 0.14em;

            color:
                rgba(255, 235, 210, 0.62);
        }


        .divider {
            width: 42px;
            height: 1px;

            margin:
                13px
                0
                13px;

            background:
                linear-gradient(
                    90deg,

                    rgba(231, 180, 111, 0.95),
                    transparent
                );
        }


        /* =========================
           СЕТКА
           ========================= */

        .weekdays,
        .days {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            column-gap: 2px;
        }


        .weekdays {
            margin-bottom: 3px;
        }


        /* =========================
           ДНИ НЕДЕЛИ
           ========================= */

        .weekday {
            height: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 0.06em;

            text-transform: uppercase;

            color:
                rgba(255, 236, 212, 0.48);
        }


        /* =========================
           ЧИСЛА
           ========================= */

        .day {
            position: relative;

            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 17px;

            line-height: 1;

            font-weight: 600;

            color:
                rgba(255, 247, 236, 0.90);

            text-shadow:
                0 2px 7px
                rgba(0, 0, 0, 0.48);
        }


        .day.empty {
            visibility: hidden;
        }


        /* выходные */

        .day.weekend {
            color:
                rgba(239, 207, 171, 0.78);
        }


        /* =========================
           СЕГОДНЯ
           ========================= */

        .day.today {
            width: 33px;
            height: 33px;

            justify-self: center;

            color: #2b1a0f;

            font-weight: 700;

            background:
                rgba(255, 225, 174, 0.93);

            box-shadow:
                0 0 0 1px
                    rgba(255, 245, 225, 0.44),

                0 0 17px
                    rgba(255, 196, 112, 0.27),

                0 4px 12px
                    rgba(0, 0, 0, 0.25);

            text-shadow: none;
        }


        .day.today::after {
            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 225, 177, 0.28);
        }


        /* =========================
           УЗКИЙ ВИДЖЕТ
           ========================= */

        @media (max-width: 430px) {

            .calendar-widget {
                height: 350px;
            }


            .calendar-panel {
                width:
                    calc(100% - 24px);

                margin: 12px;

                padding:
                    18px
                    18px
                    17px;
            }


            .day {
                height: 33px;
            }

        }

    </style>
</head>


<body>

<div
    class="calendar-widget"
    id="calendar-widget"
>

    <div class="calendar-panel">

        <div
            class="month-title"
            id="month-title"
        ></div>


        <div
            class="year"
            id="year"
        ></div>


        <div class="divider"></div>


        <div class="weekdays">

            <div class="weekday">пн</div>
            <div class="weekday">вт</div>
            <div class="weekday">ср</div>
            <div class="weekday">чт</div>
            <div class="weekday">пт</div>
            <div class="weekday">сб</div>
            <div class="weekday">вс</div>

        </div>


        <div
            class="days"
            id="days"
        ></div>

    </div>

</div>


<script>

    const monthNames = [
        "январь",
        "февраль",
        "март",
        "апрель",
        "май",
        "июнь",
        "июль",
        "август",
        "сентябрь",
        "октябрь",
        "ноябрь",
        "декабрь"
    ];


    const backgrounds = [
        "01january.png",
        "02february.png",
        "03march.png",
        "04april.png",
        "05may.png",
        "06june.png",
        "07july.png",
        "08august.png",
        "09september.png",
        "10october.png",
        "11november.png",
        "12december.png"
    ];


    function buildCalendar() {

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            now.getMonth();


        const today =
            now.getDate();


        /* фон текущего месяца */

        document.getElementById(
            "calendar-widget"
        ).style.backgroundImage =
            `url("./images/${backgrounds[month]}")`;


        /* название месяца */

        document.getElementById(
            "month-title"
        ).textContent =
            monthNames[month];


        /* год */

        document.getElementById(
            "year"
        ).textContent =
            year;


        /* первый день месяца */

        const firstDay =
            new Date(
                year,
                month,
                1
            );


        /*
        JS:
        воскресенье = 0
        понедельник = 1

        Нам нужно:
        понедельник = 0
        воскресенье = 6
        */

        const startOffset =
            (
                firstDay.getDay() + 6
            ) % 7;


        /* сколько дней в месяце */

        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        const daysContainer =
            document.getElementById(
                "days"
            );


        daysContainer.innerHTML =
            "";


        /* пустые клетки до первого числа */

        for (
            let i = 0;
            i < startOffset;
            i++
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "day empty";


            daysContainer.appendChild(
                empty
            );

        }


        /* числа месяца */

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const dayElement =
                document.createElement(
                    "div"
                );


            dayElement.className =
                "day";


            dayElement.textContent =
                day;


            const column =
                (
                    startOffset +
                    day -
                    1
                ) % 7;


            /* суббота и воскресенье */

            if (
                column === 5 ||
                column === 6
            ) {

                dayElement.classList.add(
                    "weekend"
                );

            }


            /* текущая дата */

            if (
                day === today
            ) {

                dayElement.classList.add(
                    "today"
                );

            }


            daysContainer.appendChild(
                dayElement
            );

        }

    }


    /* первый запуск */

    buildCalendar();


    /*
    Раз в минуту проверяем дату,
    чтобы после полуночи текущий день
    и новый месяц переключились сами.
    */

    setInterval(
        buildCalendar,
        60 * 1000
    );

</script>

</body>
</html>
