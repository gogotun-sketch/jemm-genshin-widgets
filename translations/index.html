<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Translation Stats</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap"
rel="stylesheet">


<style>


* {
    box-sizing:border-box;
}



html,
body {

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#243528;

}



body {

    font-family:
    "Manrope",
    sans-serif;

}



.widget {


    width:100vw;
    height:100vh;


    min-height:260px;


    border-radius:12px;


    overflow:hidden;


    position:relative;



    background-image:
    url("./images/background.png");



    background-size:cover;


    background-position:center center;



    color:#fff8e8;

}



/*
    мягкая зеленая подложка
    под стиль Sim Garden
*/


.widget::before {


    content:"";


    position:absolute;


    inset:0;



    background:


    linear-gradient(

        90deg,


        rgba(40,55,35,.55) 0%,


        rgba(45,60,38,.38) 38%,


        rgba(45,60,38,.12) 70%,


        rgba(45,60,38,.03) 100%

    );



    z-index:1;

}




/*
    теплое свечение
*/


.content {


    position:relative;


    z-index:2;



    height:100%;


    width:55%;



    display:flex;


    flex-direction:column;


    justify-content:center;



    padding-left:7%;



}





.number {


    font-family:

    "Cormorant Garamond",

    serif;



    font-size:

    clamp(

        70px,

        12vw,

        115px

    );



    line-height:.8;



    font-weight:600;



    letter-spacing:-.04em;



    color:#fff8e8;



    text-shadow:


    0 3px 12px

    rgba(30,40,20,.45);



}





.label {



    margin-top:15px;



    font-size:

    clamp(

        11px,

        1.6vw,

        15px

    );



    letter-spacing:.08em;



    text-transform:uppercase;



    color:

    rgba(

        255,

        246,

        220,

        .88

    );



    text-shadow:


    0 2px 6px

    rgba(40,40,20,.35);



}





.divider {



    width:55px;


    height:1px;



    margin:

    18px 0 15px;



    background:


    linear-gradient(

        90deg,

        rgba(224,190,120,.9),

        transparent

    );



}




.phrase {



    max-width:360px;



    font-family:

    "Cormorant Garamond",

    serif;



    font-style:italic;



    font-size:

    clamp(

        22px,

        3vw,

        32px

    );



    line-height:1.15;



    color:


    rgba(

        255,

        249,

        235,

        .95

    );



    text-shadow:


    0 2px 10px

    rgba(30,40,20,.45);



}





.mods {



    margin-top:18px;



    font-size:12px;



    color:


    rgba(

        255,

        240,

        210,

        .75

    );



    text-shadow:


    0 2px 6px

    rgba(30,40,20,.4);



}





@media(max-width:600px){



    .content {

        width:100%;

        padding:25px;

    }



    .widget::before {

        background:

        rgba(45,60,38,.42);

    }



}



</style>


</head>


<body>


<div class="widget">


<div class="content">


<div
class="number"
id="lines">
—
</div>



<div class="label">

строк переведено

</div>



<div class="divider"></div>



<div class="phrase">

Пара строк — это ведь недолго. Правда?

</div>



<div
class="mods"
id="mods">

—

</div>



</div>


</div>



<script>


const DATA_URL =

"https://raw.githubusercontent.com/gogotun-sketch/jemm-genshin-widgets/main/data/translations.json";





async function loadStats(){


try {


const response =

await fetch(

DATA_URL +

"?v=" +

Date.now(),

{

cache:"no-store"

}

);




const data =

await response.json();




document

.getElementById("lines")

.textContent =

new Intl.NumberFormat("ru-RU")

.format(

data.totalLines

);





document

.getElementById("mods")

.textContent =

`${data.modsCount} модов нашли свой перевод`;




}


catch(error){


console.error(

error

);


}


}




loadStats();




setInterval(

loadStats,

300000

);



</script>


</body>

</html>
