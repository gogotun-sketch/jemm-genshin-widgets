<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Translation Stats</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap"
rel="stylesheet">


<style>


* {
    box-sizing:border-box;
}



html,
body {

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#26382b;

}



body {

    font-family:
    "Manrope",
    sans-serif;

}




.widget {


    position:relative;


    width:100vw;

    height:100vh;


    min-height:260px;


    overflow:hidden;



    color:#fff8e8;

}




/*
    СЛОЙ КАРТИНКИ
*/


.widget::before {


    content:"";


    position:absolute;


    inset:0;



    background-image:

    url("./images/background.png");



    background-size:

    cover;



    background-position:

    center;



    z-index:0;


}





/*
    СВЕТЛОЕ ЗЕЛЕНОЕ ЗАТЕМНЕНИЕ
*/


.widget::after {


    content:"";


    position:absolute;


    inset:0;



    background:


    linear-gradient(

        90deg,


        rgba(45,65,42,.42) 0%,


        rgba(55,75,48,.25) 38%,


        rgba(55,75,48,.08) 70%,


        rgba(55,75,48,.02) 100%

    );



    z-index:1;


}






.content {


    position:relative;


    z-index:2;



    height:100%;



    width:55%;



    display:flex;


    flex-direction:column;



    justify-content:center;



    padding-left:7%;



}




.number {


    font-family:

    "Cormorant Garamond",

    serif;



    font-size:


    clamp(

        70px,

        12vw,

        115px

    );



    line-height:.82;



    font-weight:600;



    letter-spacing:-.045em;



    color:#fff9eb;



    text-shadow:


    0 3px 14px

    rgba(30,45,25,.55);



}





.label {


    margin-top:15px;



    font-size:


    clamp(

        11px,

        1.6vw,

        14px

    );



    letter-spacing:.08em;



    text-transform:uppercase;



    color:


    rgba(

        255,

        247,

        225,

        .86

    );



    text-shadow:


    0 2px 7px

    rgba(30,45,25,.5);



}





.divider {


    width:55px;


    height:1px;



    margin:


    18px 0 15px;



    background:


    linear-gradient(

        90deg,


        rgba(230,195,125,.9),


        transparent

    );


}




.phrase {


    max-width:390px;



    font-family:

    "Cormorant Garamond",

    serif;



    font-style:italic;



    font-size:


    clamp(

        22px,

        3vw,

        32px

    );



    line-height:1.15;



    color:


    rgba(

        255,

        249,

        235,

        .95

    );



    text-shadow:


    0 3px 12px

    rgba(30,45,25,.55);



}





.mods {


    margin-top:18px;



    font-size:12px;



    color:


    rgba(

        255,

        242,

        215,

        .75

    );



    text-shadow:


    0 2px 8px

    rgba(30,45,25,.5);



}






@media(max-width:700px){


    .content {

        width:100%;

        padding:

        25px;

    }



    .widget::after {


        background:


        rgba(45,65,42,.35);


    }


}



</style>


</head>



<body>



<div class="widget">


<div class="content">



<div
class="number"
id="lines">

—

</div>




<div class="label">

строк переведено

</div>




<div class="divider"></div>




<div class="phrase">

Пара строк — это ведь недолго. Правда?

</div>




<div
class="mods"
id="mods">

—

</div>




</div>



</div>





<script>


const DATA_URL =

"https://raw.githubusercontent.com/gogotun-sketch/jemm-genshin-widgets/main/data/translations.json";





async function loadStats(){


try {


const response =

await fetch(

DATA_URL +

"?v=" +

Date.now(),

{

cache:"no-store"

}

);



const data =

await response.json();





document
.getElementById("lines")
.textContent =

new Intl.NumberFormat(
"ru-RU"
)
.format(
data.totalLines
);





document
.getElementById("mods")
.textContent =

`${data.modsCount} модов обрели свой голос`;



}

catch(error){


console.error(
error
);


}



}



loadStats();



setInterval(

loadStats,

300000

);



</script>



</body>

</html>
