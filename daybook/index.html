<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daybook Stats</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #191919;
        }

        body {
            font-family:
                "Manrope",
                sans-serif;
        }


        /* =========================
           ВИДЖЕТ
           ========================= */

        .widget {
            position: relative;

            width: 100vw;
            height: 100vh;

            min-height: 300px;

            overflow: hidden;

            border-radius: 16px;

            background-image:
                url("./images/daybook.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #fff8ef;
        }


        .widget::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(18, 12, 8, 0.18) 0%,
                    rgba(18, 12, 8, 0.43) 58%,
                    rgba(18, 12, 8, 0.67) 100%
                );

            z-index: 1;
        }


        /* =========================
           КОНТЕНТ
           ========================= */

        .content {
            position: relative;

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding:
                28px
                32px;

            text-align: center;
        }


        /* =========================
           ЧИСЛО
           ========================= */

        .month-number {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    76px,
                    14vw,
                    112px
                );

            line-height: 0.82;

            font-weight: 600;

            letter-spacing: -0.045em;

            color: #fff7ea;

            text-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.58);
        }


        /* =========================
           МЕСЯЦ
           ========================= */

        .month-label {
            margin-top: 16px;

            font-family:
                "Manrope",
                sans-serif;

            font-size:
                clamp(
                    11px,
                    1.7vw,
                    14px
                );

            font-weight: 500;

            letter-spacing: 0.035em;

            color:
                rgba(
                    255,
                    239,
                    220,
                    0.82
                );

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.58);
        }


        .divider {
            width: 52px;
            height: 1px;

            margin:
                16px
                0
                13px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(232, 184, 122, 0.90),
                    transparent
                );
        }


        /* =========================
           ФРАЗА
           ========================= */

        .phrase {
            max-width: 540px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    22px,
                    4vw,
                    32px
                );

            line-height: 1.12;

            font-style: italic;

            font-weight: 500;

            color:
                rgba(
                    255,
                    247,
                    236,
                    0.95
                );

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.62);
        }


        /* =========================
           ИТОГ ЗА ГОД
           ========================= */

        .year-total {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 18px;

            z-index: 3;

            text-align: center;

            font-family:
                "Manrope",
                sans-serif;

            font-size:
                clamp(
                    10px,
                    1.4vw,
                    12px
                );

            font-weight: 500;

            letter-spacing: 0.025em;

            color:
                rgba(
                    255,
                    236,
                    214,
                    0.65
                );

            text-shadow:
                0 2px 7px
                rgba(0, 0, 0, 0.58);
        }


        @media (max-width: 500px) {

            .content {
                padding:
                    24px
                    24px
                    48px;
            }

            .phrase {
                max-width: 94%;
            }

        }

    </style>
</head>


<body>

<div class="widget">

    <div class="content">

        <div
            class="month-number"
            id="month-number"
        >
            —
        </div>


        <div
            class="month-label"
            id="month-label"
        >
            сделано в этом месяце
        </div>


        <div class="divider"></div>


        <div
            class="phrase"
            id="phrase"
        ></div>

    </div>


    <div
        class="year-total"
        id="year-total"
    >
        —
    </div>

</div>


<script>

    const DATA_URL =
        "https://raw.githubusercontent.com/gogotun-sketch/jemm-genshin-widgets/main/data/daybook.json";


    /* =========================
       МЕСЯЦЫ
       ========================= */

    const monthNames = [
        "январе",
        "феврале",
        "марте",
        "апреле",
        "мае",
        "июне",
        "июле",
        "августе",
        "сентябре",
        "октябре",
        "ноябре",
        "декабре"
    ];


    /* =========================
       ФРАЗЫ
       ========================= */

    const phrases = [

        "Сделано больше, чем кажется.",

        "Месяц вполне себе движется.",

        "Вот столько всего уже можно больше не помнить.",

        "Список стал короче. Это считается.",

        "Еще несколько пунктов перестали быть проблемой.",

        "Потихоньку превращаем «надо» в «сделано».",

        "Все это уже можно вычеркнуть.",

        "Неплохая коллекция закрытых хвостов.",

        "Каждая галочка немного освобождает голову.",

        "Список дел понемногу сдается.",

        "Еще немного порядка в этом месяце.",

        "Не все сразу. Но уже довольно много.",

        "Вот сколько всего уже осталось позади.",

        "Пункт за пунктом — и вот уже результат.",

        "Некоторые вещи наконец перестали ждать."

    ];


    /* =========================
       СКЛОНЕНИЕ "ДЕЛО"
       ========================= */

    function taskWord(number) {

        const n =
            Math.abs(number);


        const lastTwo =
            n % 100;


        const last =
            n % 10;


        if (
            lastTwo >= 11 &&
            lastTwo <= 14
        ) {

            return "дел";

        }


        if (
            last === 1
        ) {

            return "дело";

        }


        if (
            last >= 2 &&
            last <= 4
        ) {

            return "дела";

        }


        return "дел";

    }


    /* =========================
       СЛУЧАЙНАЯ ФРАЗА
       ========================= */

    function updatePhrase() {

        const index =
            Math.floor(
                Math.random() *
                phrases.length
            );


        document.getElementById(
            "phrase"
        ).textContent =
            phrases[index];

    }


    /* =========================
       ДАННЫЕ
       ========================= */

    async function loadStats() {

        try {

            const response =
                await fetch(
                    DATA_URL +
                    "?t=" +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            const monthDone =
                Number(
                    data.monthDone
                );


            const yearDone =
                Number(
                    data.yearDone
                );


            const month =
                Number(
                    data.month
                );


            const year =
                Number(
                    data.year
                );


            document.getElementById(
                "month-number"
            ).textContent =
                new Intl.NumberFormat(
                    "ru-RU"
                ).format(
                    monthDone
                );


            document.getElementById(
                "month-label"
            ).textContent =
                "сделано в " +
                (
                    monthNames[
                        month - 1
                    ] ??
                    "этом месяце"
                );


            document.getElementById(
                "year-total"
            ).textContent =
                `${year} — сделано ${yearDone} ${taskWord(yearDone)}`;

        }

        catch (error) {

            console.error(
                "Daybook stats error:",
                error
            );


            document.getElementById(
                "month-number"
            ).textContent =
                "—";


            document.getElementById(
                "month-label"
            ).textContent =
                "не удалось обновить статистику";


            document.getElementById(
                "year-total"
            ).textContent =
                "";

        }

    }


    updatePhrase();
    loadStats();


    /* данные раз в 5 минут */

    setInterval(
        loadStats,
        5 * 60 * 1000
    );


    /* новая фраза раз в час */

    setInterval(
        updatePhrase,
        60 * 60 * 1000
    );

</script>

</body>
</html>
