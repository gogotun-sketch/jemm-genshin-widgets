<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clock</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        @font-face {
            font-family: "Great Vibes";

            src:
                url("./fonts/GreatVibes-Regular.ttf")
                format("truetype");

            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #191919;
        }


        body {
            font-family:
                "Manrope",
                sans-serif;
        }


        .widget {
            position: relative;

            width: 100vw;
            height: 100vh;

            min-height: 320px;

            overflow: hidden;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #fff8ef;
        }


        .overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(24, 13, 7, 0.15) 0%,
                    rgba(24, 13, 7, 0.28) 50%,
                    rgba(24, 13, 7, 0.44) 100%
                );

            z-index: 1;
        }


        .glow {
            position: absolute;

            width: 460px;
            height: 460px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 224, 167, 0.11) 0%,
                    rgba(255, 205, 123, 0.05) 42%,
                    transparent 72%
                );

            filter: blur(18px);

            z-index: 2;

            pointer-events: none;
        }


        .content {
            position: relative;

            z-index: 3;

            width: 100%;
            height: 100%;

            padding:
                28px
                32px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        .greeting {
            margin-bottom: 10px;

            font-family:
                "Great Vibes",
                cursive;

            font-size:
                clamp(
                    38px,
                    7vw,
                    62px
                );

            line-height: 1;

            font-weight: 400;

            color: #fff8ef;

            text-shadow:
                0 3px 14px
                rgba(0, 0, 0, 0.58);
        }


        .time {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    58px,
                    10vw,
                    86px
                );

            line-height: 0.95;

            font-weight: 600;

            letter-spacing: -0.035em;

            color: #fffaf2;

            text-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.55);
        }


        .date {
            margin-top: 9px;

            font-size:
                clamp(
                    13px,
                    2vw,
                    17px
                );

            font-weight: 500;

            color:
                rgba(
                    255,
                    244,
                    229,
                    0.93
                );

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.58);
        }


        .divider {
            width: 50px;
            height: 1px;

            margin:
                15px
                0
                12px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 221, 173, 0.85),
                    transparent
                );
        }


        .phrase {
            max-width: 580px;

            font-family:
                "Great Vibes",
                cursive;

            font-size:
                clamp(
                    28px,
                    5vw,
                    42px
                );

            line-height: 1.18;

            font-weight: 400;

            color:
                rgba(
                    255,
                    248,
                    238,
                    0.96
                );

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.62);
        }


        @media (max-width: 520px) {

            .content {
                padding:
                    22px
                    24px;
            }


            .greeting {
                margin-bottom: 8px;
            }


            .divider {
                margin:
                    13px
                    0
                    10px;
            }


            .phrase {
                max-width: 92%;
            }

        }

    </style>
</head>


<body>

<div
    class="widget"
    id="widget"
>

    <div class="overlay"></div>

    <div class="glow"></div>


    <div class="content">

        <div
            class="greeting"
            id="greeting"
        ></div>


        <div
            class="time"
            id="time"
        ></div>


        <div
            class="date"
            id="date"
        ></div>


        <div class="divider"></div>


        <div
            class="phrase"
            id="phrase"
        ></div>

    </div>

</div>


<script>

    const periods = {

        morning: {
            greeting: "Доброе утро, Джем",

            image:
                "./images/morning.jpg",

            phrases: [
                "Пусть утро начинается без лишней суеты.",
                "Сначала кофе. Остальное разберется потом.",
                "Новый день пока еще ничего от тебя не требует.",
                "Можно начинать медленно.",
                "У утра есть право быть тихим.",
                "Сегодня тоже можно делать все по одному.",
                "Пока мир только просыпается.",
                "Хороший момент для первого маленького дела.",
                "Начнем без героизма.",
                "Утро создано для планов, которые еще не успели надоесть.",
                "День только открывает глаза.",
                "Немного света, немного тишины, и можно начинать.",
                "Никуда не спешим. Пока.",
                "Самое время собрать мысли в одну кучку.",
                "Пусть первый пункт будет простым.",
                "Еще один день начинается с чистого листа."
            ]
        },


        day: {
            greeting: "Добрый день, Джем",

            image:
                "./images/day.jpg",

            phrases: [
                "День уже идет. Можно идти вместе с ним.",
                "Не обязательно успевать все сразу.",
                "Одно дело за другим вполне считается системой.",
                "Планы существуют, чтобы постепенно становиться галочками.",
                "Нормальный темп тоже темп.",
                "Самое время сделать что-нибудь полезное. Или приятное.",
                "День в самом разгаре, а значит еще полно вариантов.",
                "Можно продолжать с того места, где остановилась.",
                "Некоторые дела сегодня вполне могут закончиться.",
                "Список задач сам себя не закроет. К сожалению.",
                "Еще немного движения вперед.",
                "Не обязательно делать много, чтобы день считался.",
                "Сейчас вполне подходящее время для одного хорошего решения.",
                "Пусть сегодня будет хотя бы одна приятная галочка.",
                "День пока никуда не делся.",
                "Маленькие дела тоже освобождают место в голове."
            ]
        },


        evening: {
            greeting: "Добрый вечер, Джем",

            image:
                "./images/evening.jpg",

            phrases: [
                "Самое время перейти в режим маленьких лампочек.",
                "Вечер официально разрешает делать все помедленнее.",
                "Пора включать уют.",
                "День постепенно можно отпускать.",
                "Некоторые дела вполне способны подождать до завтра.",
                "Вечеру положены теплый свет и отсутствие спешки.",
                "Самое время устроиться поудобнее.",
                "Сегодня уже сделано достаточно, чтобы немного выдохнуть.",
                "Пусть дальше будет только приятная часть дня.",
                "Вечер создан для книг, игр и маленьких ритуалов.",
                "Еще немного света перед ночью.",
                "Можно ненадолго перестать быть продуктивной.",
                "Планы на вечер имеют право быть очень простыми.",
                "День почти собран и убран на полку.",
                "Пусть вокруг станет немного тише.",
                "Время теплого света и своих дел."
            ]
        },


        night: {
            greeting: "Доброй ночи, Джем",

            image:
                "./images/night.jpg",

            phrases: [
                "Мир стал тише. Можно тоже.",
                "Все остальное вполне способно подождать до утра.",
                "Ночь хорошо подходит для режима не трогайте меня.",
                "Сегодня уже можно ничего никому не доказывать.",
                "Пора постепенно выключать день.",
                "Самое время оставить задачи завтрашней версии себя.",
                "Ночью список дел выглядит значительно менее убедительно.",
                "Еще немного тишины перед сном.",
                "День закончился. Это уже результат.",
                "Некоторые мысли лучше оставить до утра.",
                "Можно наконец перестать куда-то торопиться.",
                "Пусть ночь будет спокойной.",
                "Время закрывать лишние вкладки. Хотя бы мысленно.",
                "На сегодня мир вполне может обойтись без твоего участия.",
                "Пора складывать этот день.",
                "Все незаконченные дела переживут ночь."
            ]
        }

    };


    let currentPeriodKey =
        null;


    let currentPhrase =
        "";


    function getPeriodKey(hour) {

        if (
            hour >= 5 &&
            hour < 11
        ) {
            return "morning";
        }


        if (
            hour >= 11 &&
            hour < 17
        ) {
            return "day";
        }


        if (
            hour >= 17 &&
            hour < 22
        ) {
            return "evening";
        }


        return "night";

    }


    function choosePhrase(list) {

        const index =
            Math.floor(
                Math.random() *
                list.length
            );


        return list[index];

    }


    function updateClock() {

        const now =
            new Date();


        const hours =
            String(
                now.getHours()
            ).padStart(
                2,
                "0"
            );


        const minutes =
            String(
                now.getMinutes()
            ).padStart(
                2,
                "0"
            );


        document.getElementById(
            "time"
        ).textContent =
            `${hours}:${minutes}`;


        const dateFormatter =
            new Intl.DateTimeFormat(
                "ru-RU",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }
            );


        document.getElementById(
            "date"
        ).textContent =
            dateFormatter
                .format(now)
                .replace(/^./, char =>
                    char.toLowerCase()
                );


        const periodKey =
            getPeriodKey(
                now.getHours()
            );


        if (
            periodKey !==
            currentPeriodKey
        ) {

            currentPeriodKey =
                periodKey;


            const period =
                periods[
                    periodKey
                ];


            currentPhrase =
                choosePhrase(
                    period.phrases
                );


            document.getElementById(
                "greeting"
            ).textContent =
                period.greeting;


            document.getElementById(
                "phrase"
            ).textContent =
                currentPhrase;


            document.getElementById(
                "widget"
            ).style.backgroundImage =
                `url("${period.image}")`;

        }

    }


    updateClock();


    setInterval(
        updateClock,
        1000
    );

</script>

</body>
</html>
