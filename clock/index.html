<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clock</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Comforter&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #191919;
        }

        body {
            font-family:
                "Manrope",
                sans-serif;
        }


        /* =========================
           ВЕСЬ ВИДЖЕТ
           ========================= */

        .widget {
            position: relative;

            width: 100vw;
            height: 100vh;

            min-height: 320px;

            overflow: hidden;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #fff8ef;
        }


        /* затемнение картинки */

        .widget::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(20, 12, 7, 0.12) 0%,
                    rgba(20, 12, 7, 0.22) 45%,
                    rgba(20, 12, 7, 0.38) 100%
                );

            z-index: 1;
        }


        /* мягкое свечение по центру */

        .glow {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 500px;
            height: 500px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 225, 177, 0.10) 0%,
                    rgba(255, 205, 134, 0.045) 42%,
                    transparent 72%
                );

            filter: blur(22px);

            z-index: 2;

            pointer-events: none;
        }


        /* =========================
           КОНТЕНТ
           ========================= */

        .content {
            position: relative;

            z-index: 3;

            width: 100%;
            height: 100%;

            padding:
                28px
                34px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        /* =========================
           ПРИВЕТСТВИЕ
           ========================= */

        .greeting {
            margin-bottom: 7px;

            font-family:
                "Comforter",
                cursive;

            font-size:
                clamp(
                    48px,
                    8vw,
                    72px
                );

            line-height: 0.95;

            font-weight: 400;

            color: #fff8ef;

            text-shadow:
                0 3px 14px
                rgba(0, 0, 0, 0.58);
        }


        /* =========================
           ВРЕМЯ
           ========================= */

        .time {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    58px,
                    10vw,
                    88px
                );

            line-height: 0.95;

            font-weight: 600;

            letter-spacing: -0.035em;

            color: #fffaf2;

            text-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.55);
        }


        /* =========================
           ДАТА
           ========================= */

        .date {
            margin-top: 8px;

            font-family:
                "Manrope",
                sans-serif;

            font-size:
                clamp(
                    13px,
                    2vw,
                    17px
                );

            font-weight: 500;

            color:
                rgba(
                    255,
                    244,
                    229,
                    0.93
                );

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.58);
        }


        .divider {
            width: 50px;
            height: 1px;

            margin:
                15px
                0
                12px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 221, 173, 0.88),
                    transparent
                );
        }


        /* =========================
           ФРАЗА
           ========================= */

        .phrase {
            max-width: 610px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    26px,
                    4.7vw,
                    40px
                );

            line-height: 1.16;

            font-style: italic;

            font-weight: 500;

            color:
                rgba(
                    255,
                    248,
                    238,
                    0.97
                );

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.62);
        }


        /* =========================
           УЗКИЙ ВИДЖЕТ
           ========================= */

        @media (max-width: 520px) {

            .content {
                padding:
                    22px
                    22px;
            }

            .greeting {
                margin-bottom: 8px;
            }

            .divider {
                margin:
                    13px
                    0
                    10px;
            }

            .phrase {
                max-width: 94%;
            }

        }

    </style>
</head>


<body>

<div
    class="widget"
    id="widget"
>

    <div class="glow"></div>


    <div class="content">

        <div
            class="greeting"
            id="greeting"
        ></div>


        <div
            class="time"
            id="time"
        ></div>


        <div
            class="date"
            id="date"
        ></div>


        <div class="divider"></div>


        <div
            class="phrase"
            id="phrase"
        ></div>

    </div>

</div>


<script>

    const periods = {

        morning: {

            greeting:
                "Доброе утро, Джем",

            image:
                "./images/morning.jpg",

            phrases: [
                "Можно начинать медленно.",
                "Сначала кофе. Остальное разберется потом.",
                "Утро еще ничего от тебя не требует.",
                "Новый день пока совершенно чистый.",
                "Пусть первый пункт будет простым.",
                "Никуда не спешим. Пока.",
                "День только открывает глаза.",
                "Самое время собрать мысли в одну кучку."
            ]

        },


        day: {

            greeting:
                "Добрый день, Джем",

            image:
                "./images/day.jpg",

            phrases: [
                "Нормальный темп тоже темп.",
                "Одно дело за другим вполне считается системой.",
                "Еще немного движения вперед.",
                "Не обязательно успевать все сразу.",
                "Можно продолжать с того места, где остановилась.",
                "День пока никуда не делся.",
                "Пусть сегодня будет хотя бы одна приятная галочка.",
                "Маленькие дела тоже освобождают место в голове."
            ]

        },


        evening: {

            greeting:
                "Добрый вечер, Джем",

            image:
                "./images/evening.jpg",

            phrases: [
                "Самое время перейти в режим маленьких лампочек.",
                "Можно закрыть вкладки. Хотя бы некоторые.",
                "Пора включать уют.",
                "День постепенно можно отпускать.",
                "Некоторые дела вполне способны подождать до завтра.",
                "Самое время устроиться поудобнее.",
                "Можно ненадолго перестать быть продуктивной.",
                "Пусть вокруг станет немного тише."
            ]

        },


        night: {

            greeting:
                "Доброй ночи, Джем",

            image:
                "./images/night.jpg",

            phrases: [
                "Мир стал тише. Можно тоже.",
                "Все остальное вполне способно подождать до утра.",
                "Пора постепенно выключать день.",
                "Некоторые мысли лучше оставить до утра.",
                "Можно наконец перестать куда-то торопиться.",
                "На сегодня мир вполне может обойтись без твоего участия.",
                "Все незаконченные дела переживут ночь.",
                "День закончился. Это уже результат."
            ]

        }

    };


    let currentPeriodKey =
        null;


    let currentPhrase =
        null;


    function getPeriodKey(hour) {

        if (
            hour >= 5 &&
            hour < 11
        ) {
            return "morning";
        }


        if (
            hour >= 11 &&
            hour < 17
        ) {
            return "day";
        }


        if (
            hour >= 17 &&
            hour < 22
        ) {
            return "evening";
        }


        return "night";

    }


    function choosePhrase(list) {

        const index =
            Math.floor(
                Math.random() *
                list.length
            );


        return list[index];

    }


    function updateClock() {

        const now =
            new Date();


        const hours =
            String(
                now.getHours()
            ).padStart(
                2,
                "0"
            );


        const minutes =
            String(
                now.getMinutes()
            ).padStart(
                2,
                "0"
            );


        document.getElementById(
            "time"
        ).textContent =
            `${hours}:${minutes}`;


        const dateFormatter =
            new Intl.DateTimeFormat(
                "ru-RU",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }
            );


        document.getElementById(
            "date"
        ).textContent =
            dateFormatter.format(now);


        const periodKey =
            getPeriodKey(
                now.getHours()
            );


        if (
            periodKey !==
            currentPeriodKey
        ) {

            currentPeriodKey =
                periodKey;


            const period =
                periods[
                    periodKey
                ];


            currentPhrase =
                choosePhrase(
                    period.phrases
                );


            document.getElementById(
                "greeting"
            ).textContent =
                period.greeting;


            document.getElementById(
                "phrase"
            ).textContent =
                currentPhrase;


            document.getElementById(
                "widget"
            ).style.backgroundImage =
                `url("${period.image}")`;

        }

    }


    updateClock();


    setInterval(
        updateClock,
        1000
    );

</script>

</body>
</html>
