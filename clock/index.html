<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jemm Clock</title>

    <!-- Шрифты для времени и даты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500&display=swap"
    rel="stylesheet"
>

    <style>

        /* ----------------------------- */
        /* FRENCH KISS */
        /* ----------------------------- */

        @font-face {
            font-family: "French Kiss";

            src:
                url("./fonts/FrenchKissscript.woff2") format("woff2"),
                url("./fonts/FrenchKissscript.ttf") format("truetype");

            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }


        /* ----------------------------- */
        /* БАЗОВЫЕ НАСТРОЙКИ */
        /* ----------------------------- */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #171917;

            font-family: "Manrope", sans-serif;

            color: #fff7ed;
        }


        /* ----------------------------- */
        /* ВИДЖЕТ */
        /* ----------------------------- */

        .widget {
            position: relative;

            width: 100%;
            height: 100vh;

            min-height: 220px;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background-size: cover;
            background-repeat: no-repeat;

            transition:
                background-image 1.2s ease,
                background-position 1.2s ease;
        }


        /* ----------------------------- */
        /* ЗАТЕМНЕНИЕ */
        /* ----------------------------- */

        .overlay {
            position: absolute;
            inset: 0;

            transition: background 1.2s ease;
        }


        /* ----------------------------- */
        /* МЯГКОЕ СВЕЧЕНИЕ */
        /* ----------------------------- */

        .glow {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(255, 215, 160, 0.11),
                    transparent 43%
                );
        }


        /* ----------------------------- */
        /* СОДЕРЖИМОЕ */
        /* ----------------------------- */

        .content {
            position: relative;
            z-index: 2;

            width: min(92%, 650px);

            text-align: center;

            padding: 24px 26px;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.55),
                0 4px 18px rgba(0, 0, 0, 0.35);
        }


        /* ----------------------------- */
        /* ПРИВЕТСТВИЕ */
        /* ----------------------------- */

        .greeting {
    font-family: "French Kiss", cursive;

    font-size: clamp(34px, 5vw, 48px);
    line-height: 1.08;

    color: #fff6ee;

    margin-bottom: 10px;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.58),
        0 4px 18px rgba(0, 0, 0, 0.35),
        0 0 12px rgba(90, 45, 20, 0.22);

    -webkit-text-stroke: 0.35px rgba(120, 70, 30, 0.35);

    letter-spacing: 0.01em;
}


        /* ----------------------------- */
        /* ВРЕМЯ */
        /* ----------------------------- */

        .time {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(64px, 12vw, 106px);

            line-height: 0.88;

            font-weight: 600;

            letter-spacing: -0.035em;

            color: #fffaf2;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.48),
                0 6px 24px rgba(0, 0, 0, 0.25);
        }


        /* ----------------------------- */
        /* ДАТА */
        /* ----------------------------- */

        .date {
            margin-top: 12px;

            font-size: clamp(12px, 2vw, 15px);

            font-weight: 500;

            letter-spacing: 0.035em;

            color: rgba(255, 247, 237, 0.90);
        }


        /* ----------------------------- */
        /* РАЗДЕЛИТЕЛЬ */
        /* ----------------------------- */

        .divider {
            width: 56px;
            height: 1px;

            margin: 16px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 224, 176, 0.95),
                    transparent
                );
        }


        /* ----------------------------- */
        /* ФРАЗА */
        /* ----------------------------- */

        .phrase {
    font-family: "Cormorant Garamond", serif;

    font-size: clamp(24px, 3.6vw, 34px);

    font-style: italic;
    font-weight: 500;

    line-height: 1.12;

    color: #fff5e8;

    max-width: 520px;
    width: 90%;

    margin: 0 auto;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.72),
        0 5px 18px rgba(0, 0, 0, 0.38);

    letter-spacing: 0.01em;
}


        /* ----------------------------- */
        /* УТРО */
        /* ----------------------------- */

        .widget.morning {
            background-image: url("./images/morning.jpg");
            background-position: 50% 40%;
        }

        .widget.morning .overlay {
            background:
                linear-gradient(
                    180deg,
                    rgba(56, 34, 22, 0.14) 0%,
                    rgba(55, 34, 22, 0.20) 42%,
                    rgba(27, 18, 14, 0.46) 100%
                );
        }


        /* ----------------------------- */
        /* ДЕНЬ */
        /* ----------------------------- */

        .widget.day {
            background-image: url("./images/day.jpg");
            background-position: 50% 42%;
        }

        .widget.day .overlay {
            background:
                linear-gradient(
                    180deg,
                    rgba(50, 31, 19, 0.10) 0%,
                    rgba(48, 31, 20, 0.18) 42%,
                    rgba(26, 19, 15, 0.44) 100%
                );
        }


        /* ----------------------------- */
        /* ВЕЧЕР */
        /* ----------------------------- */

        .widget.evening {
            background-image: url("./images/evening.jpg");
            background-position: 50% 53%;
        }

        .widget.evening .overlay {
            background:
                linear-gradient(
                    180deg,
                    rgba(47, 27, 14, 0.15) 0%,
                    rgba(44, 25, 16, 0.27) 44%,
                    rgba(27, 18, 14, 0.57) 100%
                );
        }


        /* ----------------------------- */
        /* НОЧЬ */
        /* ----------------------------- */

        .widget.night {
            background-image: url("./images/night.jpg");
            background-position: 50% 54%;
        }

        .widget.night .overlay {
            background:
                linear-gradient(
                    180deg,
                    rgba(8, 18, 18, 0.18) 0%,
                    rgba(8, 18, 17, 0.35) 45%,
                    rgba(5, 12, 11, 0.67) 100%
                );
        }


        /* ----------------------------- */
        /* МАЛЕНЬКИЙ EMBED */
        /* ----------------------------- */

       @media (max-height: 280px) {

    .phrase {
        font-size: 24px;
        line-height: 1.12;
        max-width: 420px;
    }

}


        @media (max-height: 280px) {

            .greeting {
                font-size: 29px;
                margin-bottom: 4px;
            }

            .time {
                font-size: 68px;
            }

            .date {
    margin-top: 10px;

    font-size: clamp(12px, 2vw, 14px);

    font-weight: 500;

    letter-spacing: 0.045em;

    color:
        rgba(255, 247, 237, 0.82);

    text-shadow:
        0 2px 6px rgba(0, 0, 0, 0.45);
}

            .divider {
                margin-top: 9px;
                margin-bottom: 8px;
            }

            .phrase {
                font-size: 27px;
            }

        }

    </style>
</head>


<body>

    <div class="widget" id="widget">

        <div class="overlay"></div>

        <div class="glow"></div>

        <div class="content">

            <div class="greeting" id="greeting">
                Добрый вечер, Джем
            </div>

            <div class="time" id="time">
                20:43
            </div>

            <div class="date" id="date">
                вторник, 29 сентября
            </div>

            <div class="divider"></div>

            <div class="phrase" id="phrase">
                Можно оставить недоделанное недоделанным.
            </div>

        </div>

    </div>


<script>

    /* ------------------------------------------ */
    /* ФРАЗЫ */
    /* ------------------------------------------ */

    const phrases = {

        morning: [

            "Доброе утро. Никакой спешки.",

            "Сегодня можно сделать одну хорошую штуку.",

            "Кофе сначала. Великие свершения потом.",

            "Новый день уже считается достижением.",

            "Не обязательно начинать день героически.",

            "Пусть утро сначала просто случится.",

            "У тебя впереди целый день. Не надо тратить его весь сразу.",

            "Мир никуда не делся за ночь.",

            "Сегодня разрешается начать медленно.",

            "Сначала проснуться. Остальное разберется.",

            "Можно начать с самого приятного пункта.",

            "Утро ничего от тебя пока не требует.",

            "Планы подождут еще пять минут.",

            "Для начала достаточно просто открыть глаза.",

            "Сегодня не обязательно быть продуктивной с первой минуты.",

            "Пусть день начнется с чего-нибудь приятного."

        ],


        day: [

            "Что там у нас сегодня по великим свершениям?",

            "Маленький прогресс тоже прогресс.",

            "Можно заниматься важным. Можно заниматься интересным.",

            "Главное - чтобы было в удовольствие.",

            "Если дело сделано на 30%, оно уже не на нуле.",

            "Можно сменить задачу, если эта надоела.",

            "Один закрытый пункт приятнее десяти придуманных.",

            "Не все полезное должно быть мучительным.",

            "Пять минут тоже считаются.",

            "У дня еще полно времени.",

            "Иногда лучший план - делать то, что сейчас интересно.",

            "Это вполне подходящий момент сделать что-нибудь классное.",

            "Необязательно делать все сразу.",

            "Можно выбрать самое интересное и начать с него.",

            "Даже маленькая законченная штука сегодня считается.",

            "Если хочется отвлечься - возможно, пора отвлечься."

        ],


        evening: [

            "Ну что, сколько добра было сделано?",

            "День почти закончился. Можно уже никуда не торопиться.",

            "Даже если сделано немного - оно все равно сделано.",

            "Вечер официально разрешает расслабиться.",

            "Список дел прекрасно переживет до завтра.",

            "Лучшие планы на вечер могут быть вообще без планов.",

            "Все важное не обязано случиться сегодня.",

            "Можно закрыть вкладки. Хотя бы некоторые.",

            "Сегодняшнего уже достаточно.",

            "Пора включать маленькие лампы.",

            "Все, что не успело случиться сегодня, получит еще один шанс завтра.",

            "У вечера одна работа: быть приятным.",

            "Можно оставить недоделанное недоделанным.",

            "Самое время перейти в режим маленьких лампочек.",

            "Планы на завтра прекрасно можно придумать завтра.",

            "На сегодня вполне достаточно приключений."

        ],


        night: [

            "Джем. Уже ночь. Я просто напоминаю.",

            "Ночные идеи подозрительно убедительны.",

            "Можно сохранить мысль и вернуться к ней завтра.",

            "Все остальное вполне может подождать.",

            "После полуночи любая идея почему-то кажется гениальной.",

            "Если очень хочется начать новый проект - запиши название.",

            "Ночь отлично подходит для ничего.",

            "Даже Notion можно закрыть. Теоретически.",

            "Завтра эта мысль все еще будет здесь.",

            "Свет оставить можно. Работать необязательно.",

            "Еще один маленький скролл, конечно. Последний. Наверное.",

            "Мир продолжит работать без нашего непосредственного участия.",

            "На сегодня все. Остальное заберет завтрашняя Джем.",

            "Нет, новый проект в два часа ночи не срочный.",

            "Можно просто посидеть в тишине.",

            "Все хорошие идеи переживут сон."

        ]

    };


    /* ------------------------------------------ */
    /* ПРИВЕТСТВИЯ */
    /* ------------------------------------------ */

    const greetings = {

        morning: "Доброе утро, Джем",

        day: "Добрый день, Джем",

        evening: "Добрый вечер, Джем",

        night: "Доброй ночи, Джем"

    };


    /* ------------------------------------------ */
    /* ВРЕМЯ СУТОК */
    /* ------------------------------------------ */

    function getPeriod(hour) {

        if (hour >= 5 && hour < 11) {
            return "morning";
        }

        if (hour >= 11 && hour < 17) {
            return "day";
        }

        if (hour >= 17 && hour < 22) {
            return "evening";
        }

        return "night";

    }


    /* ------------------------------------------ */
    /* СЛУЧАЙНАЯ ФРАЗА */
    /* ------------------------------------------ */

    function choosePhrase(period) {

        const list = phrases[period];

        const randomIndex =
            Math.floor(Math.random() * list.length);

        return list[randomIndex];

    }


    /* ------------------------------------------ */
    /* СОСТОЯНИЕ */
    /* ------------------------------------------ */

    let currentPeriod = "";

    let currentPhraseSlot = "";


    /* ------------------------------------------ */
    /* ОБНОВЛЕНИЕ */
    /* ------------------------------------------ */

    function updateClock() {

        const now = new Date();

        const hour = now.getHours();

        const period = getPeriod(hour);


        /* Время */

        document.getElementById("time").textContent =
            now.toLocaleTimeString(
                "ru-RU",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        /* Дата */

        document.getElementById("date").textContent =
            now.toLocaleDateString(
                "ru-RU",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }
            );


        /* Смена времени суток */

        if (period !== currentPeriod) {

            const widget =
                document.getElementById("widget");


            widget.className =
                "widget " + period;


            document.getElementById("greeting").textContent =
                greetings[period];


            currentPeriod = period;

        }


        /* -------------------------------------- */
        /* НОВАЯ ФРАЗА КАЖДЫЕ 30 МИНУТ */
        /* -------------------------------------- */

        const halfHour =
            now.getMinutes() < 30 ? "0" : "1";


        const phraseSlot =
            period +
            "-" +
            now.getHours() +
            "-" +
            halfHour;


        if (phraseSlot !== currentPhraseSlot) {

            document.getElementById("phrase").textContent =
                choosePhrase(period);


            currentPhraseSlot =
                phraseSlot;

        }

    }


    /* Первый запуск */

    updateClock();


    /* Обновление часов */

    setInterval(
        updateClock,
        1000
    );

</script>

</body>
</html>
